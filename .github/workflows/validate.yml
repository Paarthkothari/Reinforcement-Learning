name: Validate

on:
  push:
    branches:
      - main
      - submission-sync
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate evaluator stdout contract in heuristic mode
        env:
          BASELINE_MODE: heuristic
        run: python inference.py | python validate_output.py
